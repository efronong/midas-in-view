<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midas in View</title>
<link rel="icon" type="image/png" sizes="32x32" href="/midas-in-view/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/midas-in-view/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/midas-in-view/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/midas-in-view/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/midas-in-view/apple-touch-icon.png?v=2">
<link rel="manifest" href="/midas-in-view/site.webmanifest?v=2">

<meta name="apple-mobile-web-app-title" content="Midas in View">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1d1b18; --muted:#6b665c; --line:#e6e0d3;
  --gold:#a9781c; --gold-soft:#f5ecd9; --up:#2d7a4b; --down:#b23b2a; --flat:#6b665c;
  --ok:#2d7a4b; --ok-bg:#e6f2ea; --warn:#8a5a00; --warn-bg:#fbefd6; --na:#6b665c; --na-bg:#efece6;
  --demo:#7a3fa0; --demo-bg:#f1e8f7; --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.5}
body.zh{font-family:Roboto,"Noto Sans SC",system-ui,sans-serif}
button{font-family:inherit}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:38px;height:38px;border-radius:9px;flex:none;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid transparent}
nav.tabs a.on{color:var(--ink);background:var(--gold-soft);border-color:#ead8b0}
.banner{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:#5b3d00;font-size:13px;border:1px solid #f0dcae}
section{padding:22px 0 6px;scroll-margin-top:110px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.price .cur{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.price .val{font-size:28px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.price .chg{font-size:13px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.price .meta{font-size:12px;color:var(--muted);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.ctl-label{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-na{background:var(--na-bg);color:var(--na)}
.b-demo{background:var(--demo-bg);color:var(--demo)}
.b-est{background:#e8eef7;color:#2b4f86}
.note{font-size:13px;color:var(--muted)}
.note strong{color:var(--ink)}
.chart-wrap{position:relative}
#chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.explain div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px}
.explain b{display:block;font-size:13px}
/* forecast */
.fc{border:1px solid #ead8b0;background:linear-gradient(180deg,#fffaf0,#fff)}
.fc-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.fc-call{font-size:22px;font-weight:700}
.fc-range{font-size:14px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sig{list-style:none;padding:0;margin:10px 0 0}
.sig li{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.sig .ic{flex:none;width:20px;text-align:center;font-weight:700}
.sig a{font-size:12px;white-space:nowrap}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fbfaf6;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rname{font-weight:600;display:flex;align-items:center;gap:8px}
.mono{width:28px;height:28px;border-radius:7px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.src{font-size:12px;white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
/* news */
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ni{display:flex;flex-direction:column;gap:6px}
.ni h3{font-size:15px;margin:0;line-height:1.35}
.ni .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.ni .fact{font-size:13px}
.ni .impact{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.ni .impact b{font-size:11px;letter-spacing:.04em;color:var(--muted);display:block}
.go{align-self:flex-start;margin-top:auto;font-size:12px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:var(--ink);background:#fff}
.go:hover{border-color:var(--gold)}
.reg{font-weight:600;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
footer{padding:28px 0 40px;color:var(--muted);font-size:12px}
.kij td,.kij th{padding:6px 10px}
@media (max-width:560px){
  .price .val{font-size:24px}
  th,td{padding:8px}
  .fc-call{font-size:19px}
}

/* ===== Midas background ===== */
html{background:var(--bg)}
body{background:transparent}
.midas-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.midas-hand{position:absolute;top:58px;right:0;width:clamp(270px,42vw,800px);aspect-ratio:691/430}
.midas-hand img{width:100%;height:100%;display:block;animation:handFloat 9s ease-in-out infinite}
.midas-glow{position:absolute;left:29.7%;top:67.4%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,214,1) 0%,rgba(255,214,120,.9) 12%,rgba(247,170,40,.45) 34%,rgba(240,150,20,0) 68%);
  animation:glowPulse 3.2s ease-in-out infinite}
.midas-glow::after{content:"";position:absolute;inset:-35%;border-radius:50%;border:1.5px solid rgba(240,170,50,.4);opacity:0;animation:glowRing 3.2s ease-out infinite}
.midas-wave{position:absolute;left:50%;bottom:-2vh;width:max(104vw,980px);aspect-ratio:1671/426;transform:translateX(-50%)}
.midas-wave .wv{position:absolute;inset:0;transform-origin:50% 60%;animation:waveFlow 11s ease-in-out infinite}

.midas-wave .wv2{opacity:.35;animation-delay:-5.5s;filter:blur(1px)}
@keyframes waveFlow{0%,100%{transform:translateY(0) scaleY(1) skewX(0)}25%{transform:translateY(-6px) scaleY(1.06) skewX(-1.5deg)}50%{transform:translateY(-2px) scaleY(.96) skewX(0)}75%{transform:translateY(5px) scaleY(1.04) skewX(1.5deg)}}
@keyframes sheenRun{0%{background-position:120% 0}100%{background-position:-20% 0}}
@keyframes glowPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.75)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes glowRing{0%{opacity:.7;transform:scale(.4)}80%,100%{opacity:0;transform:scale(1.3)}}
@keyframes handFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,3px)}}
@media (prefers-reduced-motion:reduce){.midas-bg *,.midas-bg *::after{animation:none!important}}
header.top{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
main{position:relative;z-index:1}
header.top{z-index:20}
.card,.tbl-wrap{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.banner{background:rgba(251,239,214,.88)}
.hero{min-height:clamp(200px,30vw,380px);display:flex;flex-direction:column;justify-content:center;padding:28px 0 8px;max-width:min(58%,620px)}
.hero h1{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:clamp(40px,6.4vw,84px);line-height:1;margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,#7a5410,#c99a3a 35%,#f2d58c 50%,#c99a3a 65%,#7a5410);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheenRun 9s linear infinite}
.hero p{color:var(--muted);margin:12px 0 0;font-size:clamp(14px,1.6vw,17px);max-width:440px}
@media (max-width:560px){.hero{max-width:100%;min-height:auto;padding-top:clamp(150px,44vw,200px)}.midas-hand{top:96px}}

/* softer background */
.midas-bg{opacity:.62}
.midas-glow{opacity:.8}
/* tools + theme */
.tools{display:flex;align-items:center;gap:10px;flex:none}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card-solid);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .3s,background .3s}
.theme-btn:hover{transform:rotate(20deg)}
.theme-btn .ic-moon{display:none}
html.dark .theme-btn .ic-sun{display:none} html.dark .theme-btn .ic-moon{display:block}
:root{--card-solid:#fff;--card-glass:rgba(255,255,255,.86);--hdr:rgba(255,255,255,.72);--th:#fbfaf6;--soft:#f6f3ec;--tip-bg:#1d1b18;--tip-ink:#fff;--on-bg:#1d1b18;--on-ink:#fff;--grid:#ece6d9}
html.dark{--bg:#121110;--card-solid:#1d1b18;--card-glass:rgba(29,27,24,.84);--hdr:rgba(18,17,16,.72);--ink:#efe9de;--muted:#a59d8f;--line:#38332b;--gold:#d6aa52;--gold-soft:#3a2f1a;
  --th:#211f1b;--soft:#262320;--tip-bg:#efe9de;--tip-ink:#1d1b18;--on-bg:#d6aa52;--on-ink:#1a1408;--grid:#2e2a24;
  --up:#5cbf84;--down:#e57a68;--flat:#a59d8f;--ok:#6ccf93;--ok-bg:#16301f;--warn:#e8b65c;--warn-bg:#3a2c12;--na:#a59d8f;--na-bg:#2a2723;--demo:#c79be6;--demo-bg:#2f2238}
html.dark .midas-bg{opacity:.45}
html.dark .banner{background:rgba(58,44,18,.85);color:#f0d9a8;border-color:#5a4520}
html.dark .b-est{background:#1d2a3d;color:#9fbfee}
html{transition:background .3s}
header.top{background:var(--hdr)!important}
.card,.tbl-wrap{background:var(--card-glass)!important}
th{background:var(--th)!important}
.explain div,.ni .impact{background:var(--soft)!important}
.seg,.chip,.go{background:var(--card-solid)!important;color:var(--muted)}
.go{color:var(--ink)!important}
.seg button.on,.chip.on,.lang button.on{background:var(--on-bg)!important;color:var(--on-ink)!important;border-color:var(--on-bg)!important}
.tip{background:var(--tip-bg)!important;color:var(--tip-ink)!important}
.lang{background:var(--card-solid)}
@media (max-width:560px){.lang button{padding:6px 10px}.tools{gap:6px}.brand small{display:none}}

/* refresh bar */
.refbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin:14px 0 0;padding:10px 14px;font-size:13px}
.refbar-r{display:flex;align-items:center;gap:10px}
.refnote{flex-basis:100%;margin:0}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;box-shadow:0 0 0 0 rgba(214,170,82,.6);animation:dotPing 2.4s ease-out infinite;vertical-align:middle}
@keyframes dotPing{0%{box-shadow:0 0 0 0 rgba(214,170,82,.55)}100%{box-shadow:0 0 0 9px rgba(214,170,82,0)}}
.ref-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card-solid);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.ref-btn:hover{border-color:var(--gold)}
.ref-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* hero title: glow + 3D */
.h1-stage{perspective:900px;display:inline-block}
.hero h1{display:inline-block;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform;
  filter:drop-shadow(1px 1px 0 #9a7228) drop-shadow(1px 1px 0 #87621f) drop-shadow(1px 1px 0 #745318) drop-shadow(1px 1px 0 #614412) drop-shadow(3px 6px 8px rgba(60,40,5,.28)) drop-shadow(0 0 10px rgba(246,200,100,.35));
  animation:sheenRun 9s linear infinite,titleGlow 4s ease-in-out infinite}
@keyframes titleGlow{
  0%,100%{filter:drop-shadow(1px 1px 0 #9a7228) drop-shadow(1px 1px 0 #87621f) drop-shadow(1px 1px 0 #745318) drop-shadow(1px 1px 0 #614412) drop-shadow(3px 6px 8px rgba(60,40,5,.28)) drop-shadow(0 0 8px rgba(246,200,100,.25))}
  50%{filter:drop-shadow(1px 1px 0 #9a7228) drop-shadow(1px 1px 0 #87621f) drop-shadow(1px 1px 0 #745318) drop-shadow(1px 1px 0 #614412) drop-shadow(3px 6px 8px rgba(60,40,5,.28)) drop-shadow(0 0 22px rgba(250,206,110,.7))}}
html.dark .hero h1{animation:sheenRun 9s linear infinite,titleGlowD 4s ease-in-out infinite}
@keyframes titleGlowD{
  0%,100%{filter:drop-shadow(1px 1px 0 #8a6424) drop-shadow(1px 1px 0 #6e4e1a) drop-shadow(1px 1px 0 #573d13) drop-shadow(1px 1px 0 #402c0c) drop-shadow(3px 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(246,200,100,.3))}
  50%{filter:drop-shadow(1px 1px 0 #8a6424) drop-shadow(1px 1px 0 #6e4e1a) drop-shadow(1px 1px 0 #573d13) drop-shadow(1px 1px 0 #402c0c) drop-shadow(3px 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 28px rgba(250,206,110,.75))}}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none!important;transition:none}.live-dot{animation:none}}

/* title v3: light sweeping inside the letters */
.hero h1{font-weight:400!important;filter:none!important;
  background-image:linear-gradient(105deg,#8a6220 0%,#a97c2c 30%,#c9a050 40%,#ecc66e 47%,#fbe0a0 50%,#ecc66e 53%,#c9a050 60%,#a97c2c 70%,#8a6220 100%);
  background-size:300% 100%;background-repeat:no-repeat;-webkit-background-clip:text!important;background-clip:text!important;color:transparent;
  animation:titleSweep 5.5s ease-in-out infinite!important;text-shadow:none}
html.dark .hero h1{background-image:linear-gradient(105deg,#a67c34 0%,#c99c4e 30%,#e2bd6e 40%,#fff6d8 48%,#ffe7a0 50%,#fff6d8 52%,#e2bd6e 60%,#c99c4e 70%,#a67c34 100%);
  background-size:300% 100%;-webkit-background-clip:text!important;background-clip:text!important;animation:titleSweep 5.5s ease-in-out infinite!important}
@keyframes titleSweep{0%{background-position:100% 0}60%,100%{background-position:0% 0}}
/* news filter dock */
.fdock{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:38px}
.fd-main{position:relative;z-index:3;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card-solid);color:var(--ink);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:border-color .3s}
.fd-main svg{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.fd-main .fd-val{font-weight:600;color:var(--gold)}
.fdock.open .fd-main{border-color:var(--gold)}
.fdock.open .fd-main svg{transform:rotate(180deg)}

.fdock .chip{position:relative;z-index:1;opacity:0;pointer-events:none;transform:translate(var(--dx,0),var(--dy,0)) scale(.85);
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease;transition-delay:calc(var(--i,0)*35ms)}
.fdock.open .chip{opacity:1;pointer-events:auto;transform:translate(0,0) scale(1);transition-delay:calc(var(--i,0)*55ms)}
@media (prefers-reduced-motion:reduce){.fdock .chip,.fd-main svg{transition:none}.hero h1{animation:none!important}}

.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.lastup{font-style:italic;font-size:12px;color:var(--muted);white-space:nowrap}
.ref-wrap{position:relative;display:inline-flex}
.ref-circle.spin svg{animation:spin .9s linear infinite}
.ref-circle:hover{transform:none}
.ref-circle:hover svg{transform:rotate(-30deg)}
.ref-circle svg{transition:transform .3s}
.ref-tick{position:absolute;right:calc(100% + 6px);top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#1e7cf2;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);pointer-events:none}
.ref-tick.show{animation:tickFade 2.4s ease forwards}
@keyframes tickFade{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.1)}22%{transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
.topbar{padding:12px 0}
@media (max-width:560px){.midas-hand{top:70px!important}.lastup{font-size:11px}.brand{font-size:15px;white-space:nowrap;gap:8px}.brand .logo{width:32px;height:32px}.theme-btn{width:32px;height:32px}.lang button{padding:5px 9px;font-size:12px}.tools{gap:5px}.ref-tick{width:18px;height:18px;margin-top:-9px;right:calc(100% + 4px)}}
@media (max-width:360px){.brand>div>span{display:none}}

.pnow{margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
.pnow-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.pnow-row td{background:var(--gold-soft)}
.pstack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.pstack>*,.grid2>*,.grid4>*{min-width:0}
#pBanks td:first-child{min-width:170px}
#pBanks td{white-space:normal}
.ptrend{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.ptrend .tr-call{font-size:20px;font-weight:700}
.ptrend .tr-sig{font-size:12.5px;color:var(--muted)}
.pbar{position:relative;height:6px;border-radius:3px;background:var(--soft);margin-top:4px;min-width:90px}
.pbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:rgba(214,170,82,.35)}
.pbar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold)}

.bell-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#2fb26a;display:none;box-shadow:0 0 0 2px var(--card-solid)}
#bellBtn{position:relative}
#bellBtn.on .bell-dot{display:block}
.nmodal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.nmodal[hidden],.ref-btn[hidden],#nCode[hidden]{display:none!important}
.nbox{max-width:440px;width:100%;background:var(--card-solid)!important}
#nCode{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft);color:var(--ink);resize:none}
.ref-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card-solid);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.ref-btn.primary{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}
@media (max-width:560px){.brand>div>span{font-size:14px}}
@media (max-width:370px){.brand>div>span{display:none}}
.sub:empty,.note:empty,.small:empty{display:none!important}
.grid2{align-items:start}
.whybox summary{cursor:pointer;font-weight:600;list-style:none}
.whybox summary::-webkit-details-marker{display:none}
.whybox summary::after{content:" +";color:var(--gold)}
.whybox[open] summary::after{content:" −"}
</style>
</head>

  }catch(e){}
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"});
    const j=await r.json();
    if(j.result==="success"){ ["MYR","HKD"].forEach(c=>{ if(j.rates[c]) DATA.fx[c]={...DATA.fx[c], rate:+j.rates[c].toFixed(4), status:"verified",
      note:{en:"Reference rate from ExchangeRate-API ("+(j.time_last_update_utc||"").slice(0,16)+").", zh:"ExchangeRate-API 参考汇率（"+(j.time_last_update_utc||"").slice(0,16)+"）。"}, url:"https://www.exchangerate-api.com/"}; }); got=true; }
  }catch(e){}
  if(got){ DATA.checkedAt=new Date().toISOString(); renderAll(); }
  return got;
}
async function loadData(manual){
  const btn=document.getElementById("refBtn"), tick=document.getElementById("refTick");
  if(manual){ btn.classList.add("spin"); btn.disabled=true; tick.classList.remove("show"); }
  let ok=false;
  try{
    const r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    if(d && d.spot && d.fx){ DATA=d; renderAll(); ok=true; }
  }catch(e){}
  if(manual){ if(await liveUpdate()) ok=true; }
  if(manual){ setTimeout(()=>{ btn.classList.remove("spin"); btn.disabled=false;
      if(ok){ void tick.offsetWidth; tick.classList.add("show"); } else btn.title=t("loadFail"); },400); }
}
document.getElementById("refBtn").onclick=()=>loadData(true);
loadData(false);

/* hero title 3D tilt */
(function(){
  const h=document.getElementById("heroTitle"), hero=document.querySelector(".hero");
  if(!h||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const move=(cx,cy)=>{ const r=h.getBoundingClientRect(); const x=(cx-(r.left+r.width/2))/r.width, y=(cy-(r.top+r.height/2))/r.height;
    h.style.transform=`rotateY(${Math.max(-1,Math.min(1,x))*14}deg) rotateX(${Math.max(-1,Math.min(1,-y))*10}deg)`; };
  hero.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
  hero.addEventListener("pointerleave",()=>h.style.transform="");
  hero.addEventListener("touchend",()=>setTimeout(()=>h.style.transform="",400));
})();

/* daily notifications (web push; on iPhone works from the Home Screen app) */
const VAPID_PUBLIC="BIWmN9JhzEPdBaxrZQxGCGXRh2mHUMm5TjIhMacpeFCD4GbEqfX-NI1td4pByQOatFw6PwBH_NxIfzmEsUE9DpM";
const nEl=id=>document.getElementById(id);
const b64u=s=>{ const p="=".repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); };
const pushOK=()=>("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let swReg=null;
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js",{scope:"./"}).then(r=>{swReg=r; return r.pushManager&&r.pushManager.getSubscription();}).then(sub=>{ nEl("bellBtn").classList.toggle("on",!!sub); }).catch(()=>{}); }
function nShow(text,{code=null,action=null,actionLabel=""}={}){
  nEl("nTitle").textContent=t("nTitle"); nEl("nText").textContent=text; nEl("nClose").textContent=t("nClose");
  const c=nEl("nCode"), cp=nEl("nCopy"), a=nEl("nAction");
  c.hidden=cp.hidden=!code; if(code){ c.value=code; cp.textContent=t("nCopy"); }
  a.hidden=!action; a.className="ref-btn primary"; if(action){ a.textContent=actionLabel; a.onclick=action; }
  nEl("nModal").hidden=false;
}
nEl("nClose").onclick=()=>nEl("nModal").hidden=true;
nEl("nModal").onclick=e=>{ if(e.target.id==="nModal") nEl("nModal").hidden=true; };
nEl("nCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(nEl("nCode").value); nEl("nCopy").textContent=t("nCopied"); }catch(e){ nEl("nCode").select(); } };
const subCode=sub=>JSON.stringify(sub.toJSON());
async function subscribe(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ nShow(t("nDenied")); return; }
    const reg=swReg||await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    nEl("bellBtn").classList.add("on");
    nShow(t("nDone"),{code:subCode(sub)});
  }catch(e){ nShow(t("nUnsupported")+" ("+e.message+")"); }
}
nEl("bellBtn").onclick=async()=>{
  if(isIOS && !standalone()){ nShow(t("nNeedHome")); return; }
  if(!pushOK()){ nShow(t("nUnsupported")); return; }
  if(Notification.permission==="denied"){ nShow(t("nDenied")); return; }
  const reg=swReg||await navigator.serviceWorker.ready.catch(()=>null);
  const sub=reg&&await reg.pushManager.getSubscription();
  if(sub){ nShow(t("nOn"),{code:subCode(sub),action:async()=>{ await sub.unsubscribe(); nEl("bellBtn").classList.remove("on"); nEl("nModal").hidden=true; },actionLabel:t("nTurnOff")}); }
  else nShow(t("nIntro"),{action:subscribe,actionLabel:t("nTurnOn")});
};

/* theme */
const themeBtn=document.getElementById("themeBtn");
function setTheme(dark,save){
  document.documentElement.classList.toggle("dark",dark);
  themeBtn.setAttribute("aria-label", dark?"Switch to light mode":"Switch to dark mode");
  if(save){ try{localStorage.setItem("midas-theme",dark?"dark":"light");}catch(e){} }
}
let saved=null; try{saved=localStorage.getItem("midas-theme");}catch(e){}
setTheme(saved?saved==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),false);
themeBtn.onclick=()=>setTheme(!document.documentElement.classList.contains("dark"),true);
